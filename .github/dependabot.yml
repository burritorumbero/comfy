version: 2
updates:
  - package-ecosystem: cargo
    directory: /server
    schedule:
      interval: weekly
    groups:
      server:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      app:
        patterns: ['*']
    # These move together with the Expo SDK, through `npx expo install --fix`. Expo Go only runs the
    # versions its SDK ships, so updating them one at a time breaks the app there.
    ignore:
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'jest-expo'
      - dependency-name: 'eslint-config-expo'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native/*'
      - dependency-name: '@types/react'
      - dependency-name: 'jest'
      - dependency-name: '@types/jest'
      - dependency-name: 'typescript'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
